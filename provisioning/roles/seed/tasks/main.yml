---
- name: Adding DNS aliases to /etc/hosts on seed machine
  loop: "{{ aliases | dict2items }}"
  lineinfile:
    path: /etc/hosts
    line: "{{ item.value }} {{ item.key }}"

- name: Install Firefox, Docker, Docker Compose and desktop utilities
  apt:
    name:
      - firefox
      - docker.io
      - docker-compose
      - curl
      - git
      - nano
      - vim
    state: present
    update_cache: yes

- name: Add user to docker group
  user:
    name: user
    groups: docker
    append: yes

- name: Copy Labsetup directory to user home
  copy:
    src: Labsetup/
    dest: /home/user/Labsetup/
    owner: user
    group: user
    mode: '0755'

- name: Write static flags to .env and flags.json
  shell: |
    python3 -c "
    import json, os

    t1 = 'GET'
    t2 = 'FLAG{CSRF_GET_FRIEND_ADDED}'
    t3 = 'FLAG{CSRF_POST_PROFILE_HERO}'
    t4 = 'FLAG{CSRF_DEFENSE_TOKEN_ENABLED}'
    t5 = 'FLAG{SAMESITE_COOKIE_VERIFIED}'

    # .env for Docker containers (elgg + attacker services)
    os.makedirs('/home/user/Labsetup', exist_ok=True)
    with open('/home/user/Labsetup/.env', 'w') as f:
        f.write('FLAG_T2=' + t2 + '\n')
        f.write('FLAG_T3=' + t3 + '\n')
        f.write('FLAG_T4=' + t4 + '\n')
        f.write('FLAG_T5=' + t5 + '\n')

    # JSON for the flag daemon
    os.makedirs('/opt/flag_daemon', exist_ok=True)
    with open('/opt/flag_daemon/flags.json', 'w') as f:
        json.dump({'1': t1, '2': t2, '3': t3, '4': t4, '5': t5}, f)

    print('Flags written OK')
    "

- name: Deploy flag verification daemon
  copy:
    src: flag_daemon/flag_server.py
    dest: /opt/flag_daemon/flag_server.py
    owner: root
    group: root
    mode: '0755'

- name: Install flag daemon systemd service
  copy:
    src: flag_daemon/flag-daemon.service
    dest: /etc/systemd/system/flag-daemon.service
    owner: root
    group: root
    mode: '0644'

- name: Enable and start flag daemon
  systemd:
    name: flag-daemon
    enabled: yes
    state: started
    daemon_reload: yes

- name: Create handy docker alias helper in bashrc
  blockinfile:
    path: /home/user/.bashrc
    block: |
      # SEED lab docker aliases
      alias dcbuild='docker-compose build'
      alias dcup='docker-compose up'
      alias dcdown='docker-compose down'
      alias dockps='docker ps --format "{% raw %}{{.ID}} {{.Names}}{% endraw %}"'
      docksh() { docker exec -it "$1" /bin/bash; }
