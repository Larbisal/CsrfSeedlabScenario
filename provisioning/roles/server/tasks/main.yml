---
- name: Adding DNS aliases to /etc/hosts on server machine
  loop: "{{ aliases | dict2items }}"
  lineinfile:
    path: /etc/hosts
    line: "{{ item.value }} {{ item.key }}"

- name: Install Docker and Docker Compose on server
  apt:
    name:
      - docker.io
      - docker-compose
      - curl
      - python3-pip
      - iptables
    state: present
    update_cache: yes

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Copy Labsetup files to server
  copy:
    src: Labsetup/
    dest: /root/Labsetup/
    mode: '0755'

- name: Deploy dynamic flag verification endpoint script
  copy:
    dest: /root/Labsetup/flag_server.py
    mode: '0755'
    content: |
      #!/usr/bin/env python3
      import http.server
      import socketserver
      import os

      PORT = 8080
      FLAGS = {
          "/csrf_flag/task2": os.environ.get("FLAG_TASK2", "{{ flag_task2 | default('FLAG{CSRF_GET_FRIEND_ADDED}') }}"),
          "/csrf_flag/task3": os.environ.get("FLAG_TASK3", "{{ flag_task3 | default('FLAG{CSRF_POST_PROFILE_HERO}') }}"),
          "/csrf_flag/task4": os.environ.get("FLAG_TASK4", "{{ flag_task4 | default('FLAG{CSRF_DEFENSE_TOKEN_ENABLED}') }}"),
          "/csrf_flag/task5": os.environ.get("FLAG_TASK5", "{{ flag_task5 | default('FLAG{SAMESITE_COOKIE_VERIFIED}') }}")
      }

      class FlagHandler(http.server.SimpleHTTPRequestHandler):
          def do_GET(self):
              if self.path in FLAGS:
                  self.send_response(200)
                  self.send_header("Content-type", "text/plain")
                  self.end_headers()
                  self.wfile.write((FLAGS[self.path] + "\n").encode())
              else:
                  self.send_response(404)
                  self.end_headers()
                  self.wfile.write(b"Flag not found\n")

      with socketserver.TCPServer(("", PORT), FlagHandler) as httpd:
          httpd.serve_forever()

- name: Create systemd service for flag server
  copy:
    dest: /etc/systemd/system/csrf-flag-server.service
    content: |
      [Unit]
      Description=CSRF Flag Verification Service
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/root/Labsetup
      ExecStart=/usr/bin/python3 /root/Labsetup/flag_server.py
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Reload and start csrf-flag-server
  systemd:
    name: csrf-flag-server
    daemon_reload: yes
    state: started
    enabled: yes

- name: Launch SEED Lab Docker containers
  command: docker-compose up -d
  args:
    chdir: /root/Labsetup
