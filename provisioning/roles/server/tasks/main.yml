---
- name: Adding DNS aliases to /etc/hosts on server machine
  loop: "{{ aliases | dict2items }}"
  lineinfile:
    path: /etc/hosts
    line: "{{ item.value }} {{ item.key }}"

- name: Install Docker and Docker Compose on server
  apt:
    name:
      - docker.io
      - docker-compose
      - curl
      - python3-pip
      - iptables
    state: present
    update_cache: yes

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Copy Labsetup files to server
  copy:
    src: Labsetup/
    dest: /root/Labsetup/
    mode: '0755'

- name: Write APG flags to .env and editprofile.html
  shell: |
    python3 -c "
    import json, os, re

    t2 = '{{ flag_task2 | default('FLAG_CSRF_GET_DEFAULT') }}'
    t3 = '{{ flag_task3 | default('FLAG_CSRF_POST_DEFAULT') }}'
    t4 = '{{ flag_task4 | default('FLAG_CSRF_DEF_DEFAULT') }}'
    t5 = '{{ flag_task5 | default('FLAG_SAMESITE_DEFAULT') }}'

    os.makedirs('/root/Labsetup', exist_ok=True)
    with open('/root/Labsetup/.env', 'w') as f:
        f.write('FLAG_T2=' + t2 + '\n')
        f.write('FLAG_T3=' + t3 + '\n')
        f.write('FLAG_T4=' + t4 + '\n')
        f.write('FLAG_T5=' + t5 + '\n')

    html_path = '/root/Labsetup/attacker/editprofile.html'
    if os.path.exists(html_path):
        content = open(html_path).read()
        content = re.sub(r\"name='briefdescription'\s+value='[^']*'\", f\"name='briefdescription'   value='{t3}'\", content)
        open(html_path, 'w').write(content)

    print('Server APG flags written OK')
    "

- name: Launch SEED Lab Docker containers
  command: docker-compose up -d
  args:
    chdir: /root/Labsetup

- name: Enable IPv4 forwarding on server
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Forward port 80 traffic to elgg container on server
  iptables:
    table: nat
    chain: PREROUTING
    protocol: tcp
    destination_port: 80
    destination: 10.1.30.5
    jump: DNAT
    to_destination: 10.9.0.5:80
