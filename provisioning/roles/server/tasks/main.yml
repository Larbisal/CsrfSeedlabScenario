---
- name: Adding DNS aliases to /etc/hosts on server machine
  loop: "{{ aliases | dict2items }}"
  lineinfile:
    path: /etc/hosts
    line: "{{ item.value }} {{ item.key }}"

- name: Install Docker and Docker Compose on server
  apt:
    name:
      - docker.io
      - docker-compose
      - curl
      - python3-pip
      - iptables
    state: present
    update_cache: yes

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Copy Labsetup files to server
  copy:
    src: Labsetup/
    dest: /root/Labsetup/
    mode: '0755'

- name: Write static flags to .env
  shell: |
    python3 -c "
    import json, os

    t2 = 'FLAG{CSRF_GET_FRIEND_ADDED}'
    t3 = 'FLAG{CSRF_POST_PROFILE_HERO}'
    t4 = 'FLAG{CSRF_DEFENSE_TOKEN_ENABLED}'
    t5 = 'FLAG{SAMESITE_COOKIE_VERIFIED}'

    os.makedirs('/root/Labsetup', exist_ok=True)
    with open('/root/Labsetup/.env', 'w') as f:
        f.write('FLAG_T2=' + t2 + '\n')
        f.write('FLAG_T3=' + t3 + '\n')
        f.write('FLAG_T4=' + t4 + '\n')
        f.write('FLAG_T5=' + t5 + '\n')

    print('Flags written OK')
    "

- name: Launch SEED Lab Docker containers
  command: docker-compose up -d
  args:
    chdir: /root/Labsetup
