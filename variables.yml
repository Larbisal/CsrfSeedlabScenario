---
# Automatic Problem Generation (APG) variables
# Each sandbox (student) gets unique flag values for each task.
# These are used by the platform's Answers Storage Service.
# The training.json references these via "answer_variable_name".

# Task 2: CSRF via GET — Add Friend attack flag
flag_task2:
  type: string
  prefix: "FLAG_CSRF_GET"
  length: 8
  charset: alphanumeric

# Task 3: CSRF via POST — Edit Profile attack flag
flag_task3:
  type: string
  prefix: "FLAG_CSRF_POST"
  length: 8
  charset: alphanumeric

# Task 4: Countermeasure enabled flag
flag_task4:
  type: string
  prefix: "FLAG_CSRF_DEF"
  length: 8
  charset: alphanumeric

# Task 5: SameSite cookie flag
flag_task5:
  type: string
  prefix: "FLAG_SAMESITE"
  length: 8
  charset: alphanumeric
